<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout Overlay</title>
<link rel="stylesheet" href="style.css">
<style>
body { font-size: 13px; }
.wrap { padding: 8px; }
.wrap select { flex: 1; min-width: 0; }
ol { margin: 6px 0; padding-left: 0; list-style: none; }
ol li { padding: 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><button id="prev" aria-label="Previous">◀</button><select id="pick" aria-label="Layout"></select><button id="next" aria-label="Next">▶</button></div>
  <div id="view"></div>
  <p class="hint">Shows the latest plan (All Machines Planner) and saved layouts. Updates when you re-plan. Opened with the "Open overlay" button, this window stays on top of the game (Chrome/Edge, game windowed or borderless). With overlay.ahk running, Ctrl+Alt+O hides and shows it.</p>
</div>
<script src="game-data.js"></script>
<script src="solver.js"></script>
<script src="ui.js"></script>
<script>
const $ = s => document.querySelector(s);
const read = key => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } };

// Everything worth showing: the latest plan's machines, then layouts saved on the single-machine page.
function entries() {
  const out = [], plan = read('ps-plan-v1').lastPlan;
  if (plan) for (const m of plan.machines)
    out.push({ title: `Plan · ${m.name}`, name: m.name, at: plan.at, layout: m.layout, placements: m.placements, modules: plan.pool, totals: m.totals, items: m.items || [], sources: m.sources || [] });
  for (const x of read('ps-module-optimiser-v3').savedLayouts || [])
    out.push({ title: `Saved · ${x.machineName} — ${x.stageName}`, layout: x.layout, placements: x.placements, modules: x.modules, totals: x.totals, items: [], sources: [], inserted: x.inserted || [] });
  return out;
}

let pick = 0;
try { pick = +localStorage.getItem('ps-overlay-pick') || 0; } catch {}

function render() {
  const list = entries();
  if (!list.length) { $('#pick').innerHTML = ''; $('#view').innerHTML = `<p class="hint">Nothing to show yet: run a plan or save a layout. Plans are saved per site, so open this overlay from the same site you planned on (this is ${esc(location.host || 'a local file')}). localhost and GitHub Pages keep separate data.</p>`; return; }
  pick = Math.min(Math.max(0, pick), list.length - 1);
  try { localStorage.setItem('ps-overlay-pick', pick); } catch {}
  $('#pick').innerHTML = list.map((e, i) => `<option value="${i}" ${i === pick ? 'selected' : ''}>${esc(e.title)}</option>`).join('');
  const e = list[pick];
  // Plan items tick here and in the planner (shared key); saved layouts show their ticks from the single-machine page.
  const list2 = e.name ? checklistHtml(e.placements, e.modules, installedOf(e.at)[e.name] || [], `data-install="${esc(e.name)}" data-at="${e.at}"`, e.items)
    : checklistHtml(e.placements, e.modules, e.inserted, '', [], true);
  $('#view').innerHTML = `${boardHtml(e.layout, e.placements, e.modules, 40, e.name ? installedOf(e.at)[e.name] || [] : e.inserted)}
    ${legendHtml()}
    <div style="margin-top:6px">${totalsHtml(e.totals)}</div>
    ${list2}
    ${e.sources.length ? `<b>Where the modules come from</b><ul class="plain" style="margin:4px 0;padding-left:18px">${e.sources.map(l => `<li>${l}</li>`).join('')}</ul>` : ''}`;
}

$('#pick').addEventListener('change', e => { pick = +e.target.value; render(); });
document.addEventListener('change', e => { const d = e.target.dataset; if (d.install !== undefined) { setInstalled(+d.at, d.install, +d.component, e.target.checked); render(); } });
$('#prev').addEventListener('click', () => { pick--; render(); });
$('#next').addEventListener('click', () => { pick++; render(); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') { pick--; render(); } if (e.key === 'ArrowRight') { pick++; render(); } });
window.addEventListener('storage', render); // the planner saved a new plan in another window
render();
</script>
</body>
</html>
